name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS runners: the package declares os: ["darwin"], so npm ci refuses to
    # install elsewhere. Testing on the platform this ships to is the point.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in engines, and current LTS.
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Check syntax
        run: |
          for file in src/*.js bin/*.js; do
            node --check "$file"
          done
          bash -n install.sh

      - name: Run tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Known moderate advisories in transitive deps with no upstream fix, so
      # this reports without failing the build. Raise the bar if that changes.
      - run: npm audit --audit-level=high || true

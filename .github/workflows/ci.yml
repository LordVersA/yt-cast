name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS runners: the package declares os: ["darwin"], so npm ci refuses to
    # install elsewhere. Testing on the platform this ships to is the point.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 run the full suite. The suite itself needs
        # --experimental-test-module-mocks, which landed after 18, so 18 is
        # covered by a smoke job below rather than dropped — the daemon
        # itself still supports it, as engines declares.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Check syntax
        run: |
          for file in src/*.js bin/*.js; do
            node --check "$file"
          done
          bash -n install.sh

      - name: Run tests
        run: npm test

  # engines says node >=18, so prove the app actually loads there. The test
  # suite cannot run on 18 (module mocking is newer), but the runtime must.
  smoke-node18:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - name: Load every module
        run: |
          node --check src/daemon.js
          node -e "await import('./src/state.js'); await import('./src/player.js'); await import('./src/mirror.js'); await import('./src/browser.js'); await import('./src/pairing.js'); console.log('modules load on', process.version)"
      - name: CLI runs
        run: node bin/yt-cast.js --help

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Known moderate advisories in transitive deps with no upstream fix, so
      # this reports without failing the build. Raise the bar if that changes.
      - run: npm audit --audit-level=high || true
